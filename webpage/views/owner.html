<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Management</title>
    <link rel="stylesheet" href="../public/css/style.css">
    <link rel="stylesheet" href="../public/css/owner.css">
</head>
<body>
    <header class="header">
        <div class="header-top" onclick="location.href='index.html'">
            <h1 class="title">The Flying Dutchman</h1>
        </div> 
        <div class="header-top-right">
            <div class="lang-switch">
                <button onclick="setLanguage('en')">EN</button>
                <button onclick="setLanguage('sv')">SV</button>
                <button onclick="setLanguage('tw')">繁中</button> 
                <button onclick="setLanguage('zh')">简中</button>    
            </div>
        </div>          
    </header>
    <nav>
        <ul>
            <li><a href="./index.html" data-i18n="home">Home</a></li>
            <li><a href="./menu.html" data-i18n="menu">Menu</a></li>
            <li><a href="#" data-i18n="manage">Stock Management</a></li>
            <li><a href="./index.html" data-i18n="logout">Logout</a></li>
        </ul>
    </nav>

    <section class="owner-section">
        <h2>Stock Management</h2>
        <div class="stock-list" id="stock-list">
            <div class="stock-item">
                <img src="../public/images/drinks/beer/asahi.png" alt="Beer" width="50">
                <h3>Asahi</h3>
                <p>Current Stock: <span class="stock-count">20</span></p>
                <label><input type="number" min="0" value="1" class="stock-input"></label>
                <button class="item-btn update-btn">Update</button>
                <button class="item-btn delete-btn">Delete</button>
            </div>

            <div class="stock-item">
                <img src="../public/images/drinks/wine/Lindemans Chardonnay, sek 80.png" alt="Red Wine" width="50">
                <h3>Lindemans Chardonnay</h3>
                <p>Current Stock: <span class="stock-count">15</span></p>
                <label><input type="number" min="0" value="1" class="stock-input"></label>
                <button class="item-btn update-btn">Update</button>
                <button class="item-btn delete-btn">Delete</button>
            </div>

            <div class="stock-item">
                <img src="../public/images/food/beef-taco.png" alt="Beef Taco" width="50">
                <h3>Beef Taco</h3>
                <p>Current Stock: <span class="stock-count">10</span></p>
                <label><input type="number" min="0" value="1" class="stock-input"></label>
                <button class="item-btn update-btn">Update</button>
                <button class="item-btn delete-btn">Delete</button>
            </div>

            <div class="add-item-section">
                <h3><button class="add-btn">➕ Add Item</button></h3>
            </div>
        </div>
            <!-- UNDO & REDO buttons -->
            <div id="undo-redo-container" class="undo-redo-buttons">
              <button id="undo-button" class="undo-btn">
                  <i class="fas fa-undo"></i> Undo
              </button>
              <button id="redo-button" class="redo-btn">
                  <i class="fas fa-redo"></i> Redo
              </button>
          </div>       
    </section>

    <footer>
        <h3>Copyright ©2025 All rights reserved</h3>
    </footer>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            // Update stock number
            document.querySelectorAll(".update-btn").forEach(button => {
                button.addEventListener("click", function() {
                    let stockItem = this.closest(".stock-item");
                    let inputField = stockItem.querySelector(".stock-input");
                    let stockCount = stockItem.querySelector(".stock-count");
                    let newStockValue = inputField.value;
                    
                    if (newStockValue < 0) {
                        alert("Stock value cannot be negative!");
                        return;
                    }

                    stockCount.textContent = newStockValue;
                });
            });

            // Delete button: Set the stock quantity and input box value to 0
            document.querySelectorAll(".delete-btn").forEach(button => {
                button.addEventListener("click", function() {
                    let stockItem = this.closest(".stock-item");
                    let stockCount = stockItem.querySelector(".stock-count");
                    let inputField = stockItem.querySelector(".stock-input");
                    
                    stockCount.textContent = "0";  
                    inputField.value = "0";       
                });
            });
        });
    </script>
<script src="../public/js/owner_controller.js"></script>
</body>
</html>
